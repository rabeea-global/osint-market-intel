name: OSINT Market Intelligence

on:
  schedule:
    # 05:00 UTC, Monday–Friday  (≈ 08:00 Baghdad)
    - cron: '0 5 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write        # needed to commit docs/data.json back to the repo

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analyzer (writes docs/data.json, sends email)
        env:
          EMAIL: ${{ secrets.EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: empty -> keyword fallback
        run: python analyzer.py

      - name: Publish data.json to the dashboard
        if: always()          # run even if the email step failed, so the dashboard stays fresh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data change — nothing to commit."
          else
            git commit -m "data: dashboard update $(date -u +%FT%TZ)"
            git push
          fi
